# Pink Leaf is a static site. index.html lives at the repo root.
# Netlify publishes the root and runs no build, so the store and payment
# deploy exactly as they are committed.
[build]
  publish = "."
  command = ""

# Internal working files live in the repo but must never be served.
# netlify.toml publishes the repo root, so block them explicitly.
# force = true is required: without it Netlify serves a file that exists
# and never applies the rule. They point at /404.html so a blocked path
# lands on the real not-found page rather than the homepage under a 404.
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/brand/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/content/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/RESET.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/src/*"
  to = "/404.html"
  status = 404
  force = true
