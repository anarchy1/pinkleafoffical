# Pink Leaf is a static site. index.html lives at the repo root.
# Netlify publishes the root and runs no build, so the store and payment
# deploy exactly as they are committed.
[build]
  publish = "."
  command = ""

# Internal working files live in the repo but must never be served.
# netlify.toml publishes the repo root, so block them explicitly.
[[redirects]]
  from = "/tools/*"
  to = "/"
  status = 404

[[redirects]]
  from = "/brand/*"
  to = "/"
  status = 404

[[redirects]]
  from = "/content/*"
  to = "/"
  status = 404

[[redirects]]
  from = "/CLAUDE.md"
  to = "/"
  status = 404

[[redirects]]
  from = "/RESET.md"
  to = "/"
  status = 404

[[redirects]]
  from = "/docs/*"
  to = "/"
  status = 404

[[redirects]]
  from = "/.claude/*"
  to = "/"
  status = 404
