<!DOCTYPE html>
<!--
  ============================================================================
  PINK LEAF - STORE REDESIGN PROTOTYPE (PREVIEW ONLY, NOT LIVE)
  ============================================================================
  This is a standalone review mockup for Kat. It is NOT the live site and is
  NOT linked from index.html. Nothing here processes payments or reveals stock.

  Purpose: replace the old card/carousel "game" store with a clean, standard
  rare-plant product grid, organized into three categories (Alocasia, Monstera,
  Philodendron), the way a normal niche plant store looks.

  All product names and prices are pulled from index.html's own data
  (ALL_STORE_ITEMS + ITEM_PRICES). No prices were invented. Any item without a
  real price would show "Price on inquiry". No stock quantities are shown.

  STILL TO FILL IN before this could ever go live:
    1. Confirmed inventory. Wait for the physical box-by-box count. The live
       Notion inventory is the single source of truth, not this file.
    2. Real photos. Tiles reuse the existing plants/PVxx.jpg paths where they
       exist; several are placeholders or need Kat's real shots.
    3. Real payment link. The "Inquire" buttons are placeholders (href="#").
       Wire in the Invoice4u hosted payment link only after inventory is clean.
    4. Hebrew plant names, if wanted. The live site keeps Latin names in the
       store data, so this preview does the same.

  Writing rule for this repo: no em dashes anywhere. This file follows it.
  ============================================================================
-->
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Pink Leaf - Store Preview (not live)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@200;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fdfdfd;
            --text: #1a1a1a;
            --pink: #d4a5b2;
            --mellow-pink: rgba(212, 165, 178, 0.4);
            --border: rgba(212, 165, 178, 0.3);
            --glow: 0 0 50px 15px rgba(212, 165, 178, 0.5);
            --card-bg: #ffffff;
        }
        body.dark-mode {
            --bg: #121212;
            --text: #ffffff;
            --pink: #00E676;
            --mellow-pink: rgba(0, 230, 118, 0.16);
            --border: rgba(0, 230, 118, 0.30);
            --glow: 0 0 65px 20px rgba(0, 230, 118, 0.35);
            --card-bg: #1b1b1b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            line-height: 1.5;
            transition: background 0.3s ease, color 0.3s ease;
            padding-bottom: 60px;
        }
        .serif { font-family: 'Cinzel', serif; }

        /* Preview banner so a reviewer never mistakes this for the live store */
        .preview-banner {
            background: var(--pink);
            color: #fff;
            text-align: center;
            font-size: 12px;
            letter-spacing: 1px;
            padding: 8px 14px;
            font-family: 'Cinzel', serif;
        }

        header.site-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 22px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 12px;
        }
        .brand-wrap { display: flex; align-items: center; gap: 12px; }
        .brand-logo { height: 46px; width: auto; }
        .brand-name {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            letter-spacing: 2px;
            color: var(--pink);
        }
        .head-controls { display: flex; gap: 8px; }
        .ctrl-btn {
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--pink);
            font-family: 'Cinzel', serif;
            font-size: 11px;
            letter-spacing: 1px;
            padding: 7px 14px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .ctrl-btn:hover { border-color: var(--pink); }

        .store-intro {
            text-align: center;
            padding: 34px 20px 10px;
        }
        .store-intro h1 {
            font-family: 'Cinzel', serif;
            font-size: 26px;
            letter-spacing: 3px;
            color: var(--pink);
            margin-bottom: 8px;
        }
        .store-intro p {
            font-size: 13px;
            opacity: 0.75;
            max-width: 520px;
            margin: 0 auto;
        }

        /* Category tabs */
        .store-tabs {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 26px 16px 10px;
        }
        .store-tab {
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-family: 'Cinzel', serif;
            font-size: 12px;
            letter-spacing: 1.5px;
            padding: 9px 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0.85;
        }
        .store-tab:hover { opacity: 1; border-color: var(--pink); }
        .store-tab-active {
            background: var(--pink);
            color: #fff;
            border-color: var(--pink);
            opacity: 1;
        }

        /* Product grid */
        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1180px;
            margin: 24px auto 0;
            padding: 0 20px;
        }
        .product-card {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px var(--mellow-pink);
        }
        .card-photo {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: var(--mellow-pink);
            overflow: hidden;
        }
        .card-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .card-body {
            padding: 14px 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }
        .card-name {
            font-family: 'Cinzel', serif;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            line-height: 1.35;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-price {
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            color: var(--pink);
        }
        .card-price .from-label {
            font-size: 10px;
            font-weight: 400;
            opacity: 0.7;
            display: block;
            letter-spacing: 1px;
        }
        .card-inquiry {
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            opacity: 0.7;
        }
        .avail-badge {
            position: absolute;
            top: 10px;
            inset-inline-start: 10px;
            font-family: 'Cinzel', serif;
            font-size: 9px;
            letter-spacing: 1px;
            padding: 4px 10px;
            border-radius: 50px;
            z-index: 2;
        }
        .badge-available { background: var(--pink); color: #fff; }
        .badge-coming { background: rgba(0,0,0,0.55); color: #fff; }
        body.dark-mode .badge-coming { background: rgba(255,255,255,0.18); }

        .buy-btn {
            margin-top: auto;
            border: 1px solid var(--pink);
            background: var(--pink);
            color: #fff;
            font-family: 'Cinzel', serif;
            font-size: 11px;
            letter-spacing: 1.5px;
            padding: 11px;
            border-radius: 50px;
            cursor: pointer;
            transition: opacity 0.2s ease;
            text-decoration: none;
            text-align: center;
        }
        .buy-btn:hover { opacity: 0.88; }
        .buy-btn.soft {
            background: transparent;
            color: var(--pink);
        }

        .store-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            font-family: 'Cinzel', serif;
            letter-spacing: 1px;
            opacity: 0.65;
        }

        footer.preview-foot {
            text-align: center;
            margin-top: 44px;
            padding: 20px;
            font-size: 11px;
            opacity: 0.55;
            border-top: 1px solid var(--border);
        }

        @media (max-width: 520px) {
            .store-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 12px; }
            .card-name { font-size: 11px; }
            .store-intro h1 { font-size: 21px; }
        }
    </style>
</head>
<body>
    <div class="preview-banner" id="preview-banner">PREVIEW MOCKUP - NOT LIVE - review only</div>

    <header class="site-head">
        <div class="brand-wrap">
            <img id="brand-logo" src="logo-dark.png" class="brand-logo" alt="Pink Leaf Botanical Studios">
            <span class="brand-name">PINK LEAF</span>
        </div>
        <div class="head-controls">
            <button class="ctrl-btn" id="lang-btn" onclick="toggleLang()">HE / EN</button>
            <button class="ctrl-btn" id="theme-btn" onclick="toggleTheme()">Day / Night</button>
        </div>
    </header>

    <section class="store-intro">
        <h1 id="intro-title">החנות</h1>
        <p id="intro-sub">אלוקזיה, מונסטרה ופילודנדרון נדירים ומגוונים. ליקוט ידני, אקלום מלא בישראל.</p>
    </section>

    <nav class="store-tabs" id="store-tabs">
        <button class="store-tab store-tab-active" data-cat="all" onclick="setCategory('all', this)">ALL</button>
        <button class="store-tab" data-cat="Alocasia" onclick="setCategory('Alocasia', this)">ALOCASIA</button>
        <button class="store-tab" data-cat="Monstera" onclick="setCategory('Monstera', this)">MONSTERA</button>
        <button class="store-tab" data-cat="Philodendron" onclick="setCategory('Philodendron', this)">PHILODENDRON</button>
    </nav>

    <main class="store-grid" id="store-grid"></main>

    <footer class="preview-foot">
        Store redesign prototype for Pink Leaf. Prices and names pulled from the site data.
        Photos, confirmed inventory, and the real payment link are still to be added.
    </footer>

    <script>
        // ── Product data (copied verbatim from index.html ALL_STORE_ITEMS) ──
        const ALL_STORE_ITEMS = [
            { id: "PV19", name: "Alocasia Polly Pink var", availability: ["High Variegation", "Regular Variegation"], status: "coming" },
            { id: "PV81", name: "Alocasia Heart Balloon", availability: ["Starter Plant"], status: "coming" },
            { id: "PV25", name: "Alocasia Macrorrhiza Var.", availability: ["Starter Plant", "Mature Plant"], status: "coming" },
            { id: "PV48", name: "Philodendron Jose Buono", availability: ["Starter Plant", "Mature Plant"], status: "available" },
            { id: "PV87", name: "Alocasia Maharani Albo", availability: ["Albo"], status: "available" },
            { id: "PV84", name: "Alocasia Pseudo Sanderiana Pink", availability: ["Pink"], status: "available" },
            { id: "PV40", name: "Alocasia Ninja Albo", availability: ["Albo"], status: "available" },
            { id: "PV18", name: "Alocasia Wentii Pink", availability: ["Pink"], status: "available" },
            { id: "PV89", name: "Alocasia Melo Albo", availability: ["Albo"], status: "available" },
            { id: "PV44", name: "Alocasia Pink Dragon Stardust Mint", availability: ["Stardust Mint"], status: "available" },
            { id: "PV78", name: "Alocasia Simpo Albo", availability: ["Albo"], status: "available" },
            { id: "PV35", name: "Alocasia Jacklyn Variegated", availability: ["Variegated"], status: "available" },
            { id: "PV37", name: "Alocasia Silver Dragon Aurea", availability: ["Aurea"], status: "available" },
            { id: "PV15", name: "Alocasia Dragon Scale Albo", availability: ["Albo"], status: "available" },
            { id: "PV23", name: "Alocasia Black Velvet Aurea", availability: ["Aurea"], status: "available" },
            { id: "PV14", name: "Alocasia Dragon Scale Mint", availability: ["Mint"], status: "available" },
        ];

        // ── Real prices (copied verbatim from index.html ITEM_PRICES) ──
        // No prices invented. Items missing here fall back to "Price on inquiry".
        const ITEM_PRICES = {
            "PV19_High Variegation": 330,
            "PV19_Regular Variegation": 330,
            "PV81_Starter Plant": 500,
            "PV25_Starter Plant": 50,
            "PV25_Mature Plant": 150,
            "PV48_Starter Plant": 50,
            "PV48_Mature Plant": 150,
            "PV87_Albo": 880,
            "PV84_Pink": 650,
            "PV40_Albo": 550,
            "PV18_Pink": 550,
            "PV89_Albo": 450,
            "PV44_Stardust Mint": 450,
            "PV78_Albo": 450,
            "PV35_Variegated": 450,
            "PV37_Aurea": 450,
            "PV15_Albo": 420,
            "PV23_Aurea": 450,
            "PV14_Mint": 150,
        };

        // Bilingual UI strings. Plant names stay in Latin, matching the live site.
        const T = {
            he: {
                introTitle: "החנות",
                introSub: "אלוקזיה, מונסטרה ופילודנדרון נדירים ומגוונים. ליקוט ידני, אקלום מלא בישראל.",
                available: "במלאי",
                coming: "בקרוב",
                from: "החל מ",
                inquire: "לפרטים ורכישה",
                inquiryPrice: "מחיר לפי פנייה",
                emptyPrefix: "עוד",
                emptySuffix: "בקרוב",
                emptyAll: "צמחים",
            },
            en: {
                introTitle: "The Store",
                introSub: "Rare and variegated Alocasia, Monstera and Philodendron. Hand-selected, fully acclimated in Israel.",
                available: "In stock",
                coming: "Coming soon",
                from: "from",
                inquire: "Inquire to buy",
                inquiryPrice: "Price on inquiry",
                emptyPrefix: "More",
                emptySuffix: "coming soon",
                emptyAll: "plants",
            }
        };

        let lang = 'he';
        let category = 'all';

        // Resolve a plant's family from its name, same rule the live site uses.
        function plFamily(item) {
            const n = (item.name || '').toLowerCase();
            if (n.includes('alocasia')) return 'Alocasia';
            if (n.includes('monstera')) return 'Monstera';
            if (n.includes('philodendron')) return 'Philodendron';
            return 'Others';
        }

        // Lowest real price for an item across all its variants, or null if none.
        function lowestPrice(item) {
            let low = null;
            (item.availability || []).forEach(opt => {
                const p = ITEM_PRICES[item.id + '_' + opt];
                if (typeof p === 'number' && (low === null || p < low)) low = p;
            });
            return low;
        }

        // True when the item has more than one distinct real price (show "from").
        function hasPriceRange(item) {
            const prices = (item.availability || [])
                .map(opt => ITEM_PRICES[item.id + '_' + opt])
                .filter(p => typeof p === 'number');
            return new Set(prices).size > 1;
        }

        function renderStore() {
            const t = T[lang];
            let items = ALL_STORE_ITEMS.slice();
            if (category !== 'all') {
                items = items.filter(it => plFamily(it) === category);
            }
            // Available first, coming soon after.
            items.sort((a, b) => (a.status === 'available' ? 0 : 1) - (b.status === 'available' ? 0 : 1));

            const grid = document.getElementById('store-grid');
            if (!items.length) {
                const label = category === 'all' ? t.emptyAll : category;
                grid.innerHTML = '<div class="store-empty">' + t.emptyPrefix + ' ' + label + ' ' + t.emptySuffix + ' 🌿</div>';
                return;
            }

            let html = '';
            items.forEach(item => {
                const isAvailable = item.status === 'available';
                const badgeClass = isAvailable ? 'badge-available' : 'badge-coming';
                const badgeText = isAvailable ? t.available : t.coming;

                const low = lowestPrice(item);
                let priceHTML;
                if (low === null) {
                    priceHTML = '<div class="card-inquiry">' + t.inquiryPrice + '</div>';
                } else if (hasPriceRange(item)) {
                    priceHTML = '<div class="card-price"><span class="from-label">' + t.from + '</span>₪' + low + '</div>';
                } else {
                    priceHTML = '<div class="card-price">₪' + low + '</div>';
                }

                // Buy button is a placeholder until the real payment link is ready.
                const btnClass = isAvailable ? 'buy-btn' : 'buy-btn soft';
                const btn = '<a href="#" class="' + btnClass + '" data-id="' + item.id + '" onclick="return false;">' + t.inquire + '</a>';

                html += '' +
                    '<div class="product-card">' +
                        '<span class="avail-badge ' + badgeClass + '">' + badgeText + '</span>' +
                        '<div class="card-photo">' +
                            '<img src="plants/' + item.id + '.jpg" alt="' + item.name + '" loading="lazy" onerror="this.src=\'logo-dark.png\'">' +
                        '</div>' +
                        '<div class="card-body">' +
                            '<div class="card-name" dir="ltr">' + item.name + '</div>' +
                            priceHTML +
                            btn +
                        '</div>' +
                    '</div>';
            });
            grid.innerHTML = html;
        }

        function setCategory(cat, btn) {
            category = cat;
            document.querySelectorAll('.store-tab').forEach(t => t.classList.remove('store-tab-active'));
            if (btn) btn.classList.add('store-tab-active');
            renderStore();
        }

        function applyLang() {
            const t = T[lang];
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'he') ? 'rtl' : 'ltr';
            document.getElementById('intro-title').textContent = t.introTitle;
            document.getElementById('intro-sub').textContent = t.introSub;
            renderStore();
        }

        function toggleLang() {
            lang = (lang === 'he') ? 'en' : 'he';
            applyLang();
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const dark = document.body.classList.contains('dark-mode');
            const logo = document.getElementById('brand-logo');
            if (logo) logo.src = dark ? 'logo-dark.png' : 'logo-light.png';
        }

        // Initial paint
        applyLang();
    </script>
</body>
</html>
