            <div class="sort-wrap">

                    <option value="name-desc">ת-א / Z-A</option>
                    <option value="price-asc">מחיר: נמוך לגבוה</option>
                    <option value="price-desc">מחיר: גבוה לנמוך</option>

            </div>
        </div>
        <div class="results-count" id="resultsCount"></div>

            <div class="footer-links">
